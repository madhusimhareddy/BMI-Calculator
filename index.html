<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h1><b>BMI CALCULATOR</b></h1>
    <div>
    <form >
        <label for="height">Height in cm : </label>
        <input type="text" name="height" id="height" class="input">
    </div>
    <div>
        <label for="weight">Weight in kg : </label>
        <input type="text" name="weight" id="weight" class="input">
    </div>



    <button id="button">calculate</button>
    </form>
    
    <div class="design">
    <div id = "results"></div>
    <div id = "comparision"></div>
    </div>


    <div class="weight_guide">
        <h4>BMI Weight Guide</h4>
        <p>Less than 18.6     ==> Under Weight</p>
        <p>Btw 18.6 and 24.9  ==> Normal Range</p>
        <p>Greater than 24.9  ==> Overweight</p>
    </div>

    </div>
    <script src="bmi.js"></script>
</body>
</html>
